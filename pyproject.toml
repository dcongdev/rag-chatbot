[project]
name = "ai-knowledge-base-assistant"
version = "0.1.0"
description = "A lightweight modular AI Knowledge Base Assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.66.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
