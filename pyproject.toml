[project]
name = "ai-knowledge-base-assistant"
version = "0.1.0"
description = "A lightweight modular AI Knowledge Base Assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.11",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.0",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
